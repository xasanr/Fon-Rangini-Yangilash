<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>40. Fon O'zgartirish</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; transition: background 0.3s; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 280px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Fon Rangini Yangilash</h3>
        <button onclick="changeBg()">Rangni O'zgartirish</button>
    </div>
    <script>
        function changeBg() {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        }
    </script>
</body>
</html>
